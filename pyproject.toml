[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runeopoly-bot"
version = "0.1.0"
description = "Computer player decision policy for Runeopoly"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.urls]
Homepage = "https://github.com/Cavatapi/runeopoly-bot"

[tool.setuptools.packages.find]
include = ["runeopoly_bot"]
